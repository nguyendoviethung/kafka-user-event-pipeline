server:
  port: 8085

spring:
  application:
    name: server-a

  datasource:
    url: jdbc:postgresql://localhost:5432/server_a_db
    username: postgres
    password: 2107
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    topics:
      user-events: user-events

logging:
  level:
    com.example.servera: DEBUG
    org.hibernate.SQL: DEBUG